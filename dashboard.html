<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./assests/css/styles.css" /> <!-- link to css file -->
  <link rel="stylesheet" href="./assests/css/layout.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Dashboard</title>
</head>
<body>
  <header>
    <a href="index.html" id="logo-link">
      <img src="./assests/images/utkarsh-tuition-logo.png" alt="logo" id="site-logo"> <!-- logo -->
    </a>
  </header>
  <main class="dashboard-page">
    <h1>Dashboard</h1>
    <section>
      <h2 class="heading">Add Student</h2>
      <form action="" class="add-student-form">
        <label for="student-image">Student Photo</label>
        <input type="file" src="" alt="" required>
        <label for="student-name">Student Name</label>
        <input type="text" name="student-name" id="student-name" required>
        <label for="student-name">Student Class</label>
        <select name="student-class" id="student-class" required>
          <option value="">Select</option>
          <option value="first">First</option>
          <option value="first">Second</option>
          <option value="first">Third</option>
          <option value="first">Fourth</option>
          <option value="first">Fifth</option>
          <option value="first">Sixth</option>
          <option value="first">Seventh</option>
        </select>
        <label for="student-percentage">Student Percentage:</label>
        <input type="number" id="percentage" min="0" max="100" step="0.01" placeholder="e.g 75.5" required>
        <button type="submit" class="student-submit-btn">Submit</button>
      </form>
    </section>
    <section>
      <h2 class="heading">Display Student</h2>
      <div class="student-container">
          <div class="student-data">
              <img src="./assests/images/student-img-2.jpg" alt="student-image" class="student-image">
              <p>Student: A</p>
              <p>Class: First</p>
              <p>Percentage: 80%</p>
              <button class="deleter button"><i class="fas fa-trash"></i> Delete</button>
          </div>
          <div class="student-data">
                <img src="./assests/images/student-img-2.jpg" alt="student-image" class="student-image">
                <p>Student: B</p>
                <p>Class: Second</p>
                <p>Percentage: 70%</p>
          </div>
      </div>
    </section>
  </main>
</body>
</html>
