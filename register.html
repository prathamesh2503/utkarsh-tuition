<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./assests/css/styles.css" /> <!-- link to css file -->
  <link rel="stylesheet" href="/assests/css/layout.css">
  <title>Teacher Registration</title>
</head>
<body>
  <header>
    <a href="index.html" id="logo-link">
      <img src="./assests/images/utkarsh-tuition-logo.png" alt="logo" id="site-logo"> <!-- logo -->
    </a>
  </header>
  <main class="registration-page">
    <h2>Teacher Registration</h2>
    <form action="" class="registration-form">
      <label for="first-name">First Name:</label>
      <input type="text" name="first-name" id="first-name" required>
      <label for="first-name">Last Name:</label>
      <input type="text" name="last-name" id="last-name" required>
      <label for="first-name">Address:</label>
      <textarea name="address" id="address" required></textarea>
      <input type="submit" value="Register" class="register-btn">
    </form>
  </main>
</body>
</html>
