<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./assests/css/styles.css" /> <!-- link to css file -->
  <title>Teacher Login</title>
</head>
<body>
  <header id="main-header">
    <div id="logo-container">
      <a href="/">
        <img src="./assests/images/utkarsh-tuition-logo.png" alt="logo" id="site-logo"> <!-- logo -->
      </a>
    </div>
  </header>
  <main class="login-page">
    <h3>Registered Teacher Login</h3>
    <form action="" class="login-form" id="login-form">
        <label for="email">Email: </label>
        <input type="email" name="email" id="email">
        <label for="password">Password: </label>
        <input type="password" name="password" id="password">
        <input type="submit" value="Login" class="login-btn">
    </form>
    <button><a href="./register.html">Teacher Register</a></button>
  </main>
  
 <script src="./assests/js/login.js"></script>
</body>
</html>
